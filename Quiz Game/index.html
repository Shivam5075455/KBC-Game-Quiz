<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC</title>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div id="welcomeScreen" >
        <div class="container">
            <label>Enter your name to start</label>
            <input id="username" type="text" placeholder="Enter your username"/>
            <small class="error" id="usernameError"></small>
            <button onclick="startGame()">Start game</button>
        </div>
    </div>
    <!-- Quiz Area -->
    <div  id="quizArea" class="hide">
        <div class="questionArea">
            <div class="question">
                <!-- lifeline area -->
            <div class="lifelineArea">
                <button id="fiftyFiftyButton" onclick="fiftyFifty()">50-50</button>
                <div id="timer"></div>
            </div>
                <!-- question -->
                <div id="questionStatement">
                </div>
                <div id="answers">

                </div>
            </div>
        </div>
        
        <!-- lever area -->
         <div class="levelArea">
            <ul id="levelList">

            </ul>
         </div>

    </div>
<!-- Result Screen -->
    <div id="resultScreen" class="hide">
        <div class="container">
            <h1 id="message">Better luck next time!</h1>
            <h3 id="priceMoney">You won:</h3>
            <button class="button" onclick="location.reload()">Play Again</button>
        </div>
    </div>65432

    <script src="index.js"></script>
</body>
</html>
